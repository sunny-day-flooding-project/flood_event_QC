name: flood-qc
channels:
  - conda-forge
dependencies:
  - python=3.12
  # QC dashboard
  - streamlit>=1.50
  # Data processing and plotting
  - pandas
  - numpy
  - matplotlib
  - pillow
  - pytz
  - astral
  # Data access (SDFP API, NWS/IEM advisories, NDBC buoys, NOAA tide gauges)
  - requests
  - openpyxl
  - ndbc-api
  - noaa-coops=0.4.0
  # Config files for the extreme event scripts
  - pyyaml
  # Notebooks
  - jupyter
